services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    image: team10leaprunfront:local
    ports:
      - "${FRONTEND_PORT}:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
